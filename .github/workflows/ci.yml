name: CYBERGUARD-X CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-and-audit:
    name: Security & Static Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Run No Fake Data Audit
        run: |
          chmod +x .claude/skills/no-fake-data-audit/audit.sh
          bash .claude/skills/no-fake-data-audit/audit.sh

  backend:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cyberguard_x_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap libpcap-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt ruff mypy pip-audit

      - name: Run Dependency Audit
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln CVE-XXXX-XXXX || true

      - name: Run Ruff Lint
        run: |
          ruff check backend/app backend/tests

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/cyberguard_x_test
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@localhost:5432/cyberguard_x_test
          PYTHONPATH: .
          JWT_SECRET_KEY: test_secret_key_at_least_32_chars_long_12345
        run: |
          python -m pytest -v backend/tests

  frontend:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Frontend Dependency Audit
        working-directory: frontend
        run: |
          npm audit --omit=dev || true

      - name: Run TypeScript typecheck
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: Run ESLint
        working-directory: frontend
        run: |
          npx eslint .

      - name: Build frontend for production
        working-directory: frontend
        run: |
          npx vite build
