# Ruff configuration for CYBERGUARD-X
line-length = 120
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "backend/migrations",
    "migrations",
]

[lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function call `Depends` in argument defaults (standard FastAPI pattern)
]

[lint.per-file-ignores]
"backend/app/db/models/__init__.py" = ["E402", "F401"]
"backend/tests/*" = ["E402", "F401", "F841"]
